name: Tests and report

on:
  push:
    branches: [main]
    paths-ignore:
      - test_report.md
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: python -m pip install -r requirements.txt
      - name: Check CAD JavaScript module syntax
        id: javascript
        shell: bash
        continue-on-error: true
        run: node --input-type=module --check < cad_viewer.js
      - name: Test CAD geometry calculations with Node
        id: geometry
        shell: bash
        continue-on-error: true
        run: node --test tests/test_cad_geometry.mjs tests/test_cad_ui.mjs
      - name: Test actual Chromium WebGL outlines and octave points
        id: browser
        shell: bash
        continue-on-error: true
        env:
          CAD_BROWSER_DEPS: ${{ runner.temp }}/cad-browser
        run: |
          set -e
          npm install --no-save --no-package-lock --prefix "$CAD_BROWSER_DEPS" three@0.160.0 playwright@1.51.1
          node --test tests/test_cad_browser.mjs
      - name: Execute tests and generate report
        id: tests
        if: always()
        continue-on-error: true
        run: python tests/run_tests.py
      - name: Ensure a report exists even on setup failure
        if: always()
        shell: bash
        run: |
          if [[ ! -f test_report.md ]]; then
            printf '# Test Report\n\n- Result: **FAIL**\n- Reason: test runner or environment failed before generating the report.\n' > test_report.md
          fi
          if [[ '${{ steps.install.outcome }}' != 'success' ]] || [[ '${{ steps.javascript.outcome }}' != 'success' ]] || [[ '${{ steps.geometry.outcome }}' != 'success' ]] || [[ '${{ steps.browser.outcome }}' != 'success' ]]; then
            sed -i 's/Result: \*\*PASS\*\*/Result: **FAIL** (dependency, JS syntax, or geometry or browser validation failed)/' test_report.md
          fi
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-report-${{ matrix.os }}-py${{ matrix.python }}
          path: test_report.md
      - name: Commit report to main (report-only commits do not retrigger CI)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test_report.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore(ci): update test_report.md [skip ci]'
            git push origin HEAD:main
          fi
      - name: Fail workflow when install or tests fail
        if: always()
        shell: bash
        run: |
          [[ '${{ steps.install.outcome }}' == 'success' ]] && [[ '${{ steps.tests.outcome }}' == 'success' ]] && [[ '${{ steps.javascript.outcome }}' == 'success' ]] && [[ '${{ steps.geometry.outcome }}' == 'success' ]] && [[ '${{ steps.browser.outcome }}' == 'success' ]]
