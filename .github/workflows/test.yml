name: Tests and report

on:
  push:
    branches: [main]
    paths-ignore:
      - test_report.md
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: python -m pip install -r requirements.txt
      - name: Check CAD JavaScript module syntax
        id: javascript
        shell: bash
        continue-on-error: true
        run: node --input-type=module --check < cad_viewer.js
      - name: Execute tests and generate report
        id: tests
        if: always()
        continue-on-error: true
        run: python tests/run_tests.py
      - name: Ensure a report exists even on setup failure
        if: always()
        shell: bash
        run: |
          if [[ ! -f test_report.md ]]; then
            printf '# Test Report\n\n- Result: **FAIL**\n- Reason: test runner or environment failed before generating the report.\n' > test_report.md
          fi
          if [[ '${{ steps.install.outcome }}' != 'success' ]] || [[ '${{ steps.javascript.outcome }}' != 'success' ]]; then
            sed -i 's/Result: \*\*PASS\*\*/Result: **FAIL** (dependency or JS syntax validation failed)/' test_report.md
          fi
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}-py${{ matrix.python }}
          path: test_report.md
      - name: Commit report to main (report-only commits do not retrigger CI)
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test_report.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore(ci): update test_report.md [skip ci]'
            git push origin HEAD:main
          fi
      - name: Fail workflow when install or tests fail
        if: always()
        shell: bash
        run: |
          [[ '${{ steps.install.outcome }}' == 'success' ]] && [[ '${{ steps.tests.outcome }}' == 'success' ]] && [[ '${{ steps.javascript.outcome }}' == 'success' ]]
