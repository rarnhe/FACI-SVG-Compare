<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>Fab / Subfab · CAD 双层联动</title>
<style>
:root { font-family: "Segoe UI","Microsoft YaHei",sans-serif; color-scheme: light; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; width:100%; overflow:hidden; background:#101a25; }
#layout { display:grid; grid-template-columns:minmax(0, 1.4fr) minmax(330px, 1fr); height:100vh; width:100vw; gap:0; }
#cad-pane { min-width:0; min-height:0; display:flex; flex-direction:column; position:relative; background:#0d1b29; border-right:1px solid #314456; }
#cad-info { z-index:4; position:absolute; top:14px; left:15px; right:70px; padding:11px 15px;
  color:#e6f3ff; background:#152638e8; border:1px solid #56708980; border-radius:9px;
  pointer-events:none; font-size:12px; line-height:1.55; max-width:460px; }
#cad-info strong { display:block; font-size:14px; letter-spacing:.3px; }
#selected-info { font-weight:600; margin-top:3px; color:#97dcf2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#reset-view { position:absolute; z-index:6; top:15px; right:16px; display:flex; align-items:center; justify-content:center;
  width:43px; height:43px; border-radius:10px; color:#eaf5ff; font-size:27px;
  background:#24547b; border:1px solid #6c99bd; cursor:pointer; box-shadow:0 3px 9px #0006; }
#reset-view:hover, #reset-view:focus-visible { background:#3177a8; outline:2px solid #93cffb; }
#cad-layers { flex:1; min-height:0; display:grid; grid-template-rows:minmax(0,1fr) minmax(0,1fr); }
.cad-layer { position:relative; min-width:0; min-height:0; overflow:hidden; border-bottom:1px solid #51687c; }
.cad-layer:last-child { border-bottom:0; }
.cad-layer canvas { position:absolute; inset:0; display:block; }
.layer-name { position:absolute; z-index:2; top:9px; right:9px; padding:5px 11px;
  background:#19384ed9; color:#d9f2fa; font-size:12px; font-weight:700;
  border:1px solid #65869c; border-radius:6px; pointer-events:none; }
.layer-status { position:absolute; z-index:2; left:14px; bottom:10px; max-width:85%; padding:4px 9px;
  color:#b2d4dd; background:#112435d9; font-size:11px; border-radius:5px; pointer-events:none; }
#reference-pane { background:#f0f3f7; display:flex; flex-direction:column; min-width:0; min-height:0; }
#reference-header { flex:0 0 auto; padding:12px 15px 10px; border-bottom:1px solid #d2dce5; color:#28455a; }
#reference-header strong { font-size:14px; }
#reference-header small { display:block; font-size:11px; color:#627587; margin-top:3px; }
#reference-frames { flex:1; min-height:0; display:grid; grid-template-rows:minmax(0,1fr) minmax(0,1fr); gap:1px; background:#d5dfe7; }
.reference-frame { min-height:0; min-width:0; background:#fff; display:flex; flex-direction:column; overflow:hidden; }
.reference-label { flex:0 0 auto; padding:6px 10px; background:#f8fafc; font-size:11px; color:#48647d; border-bottom:1px solid #e8edf1; }
.reference-body { flex:1; min-height:0; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.reference-body img { width:100%; height:100%; display:none; object-fit:contain; }
.reference-placeholder { font-size:12px; color:#8496a6; padding:18px; text-align:center; }
@media(max-width:850px) {
  #layout { grid-template-columns:1fr; grid-template-rows:minmax(0, 56%) minmax(0, 44%); }
  #cad-pane { border-right:0; border-bottom:1px solid #314456; }
  #cad-info { font-size:11px; padding:7px 9px; top:6px; left:6px; max-width:330px; }
  #reset-view { top:8px; right:8px; }
}
</style>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="layout">
  <section id="cad-pane" aria-label="Fab 和 Subfab 双层 CAD">
    <div id="cad-info">
      <strong>Fab / Subfab · 联动 CAD 视图</strong>
      滚轮放大/缩小 · 右键拖动平移 · 左键拖动旋转 · 点击色块查看信息
      <div id="selected-info" aria-live="polite">尚未选中对象</div>
    </div>
    <button id="reset-view" title="恢复两层的平面俯视及初始缩放" aria-label="恢复俯视" type="button">↺</button>
    <div id="cad-layers">
      <div class="cad-layer" id="fab-stage">
        <span class="layer-name">FAB · Sheet 1</span>
        <span class="layer-status" id="fab-status">正在载入工程图……</span>
      </div>
      <div class="cad-layer" id="subfab-stage">
        <span class="layer-name">SUBFAB · Sheet 2</span>
        <span class="layer-status" id="subfab-status">正在载入工程图……</span>
      </div>
    </div>
  </section>
  <aside id="reference-pane" aria-label="一分之三倍频程参考图">
    <header id="reference-header">
      <strong>数据分析参考图</strong>
      <small>两张 SVG 等宽显示，垂直平分可用空间</small>
    </header>
    <div id="reference-frames">
      <section class="reference-frame">
        <div class="reference-label">PSD_base.svg</div>
        <div class="reference-body"><img id="psd-reference" alt="PSD 分析底图">
          <div class="reference-placeholder" id="psd-placeholder">未提供 PSD_base.svg</div></div>
      </section>
      <section class="reference-frame">
        <div class="reference-label">OneThreeOctave_base.svg</div>
        <div class="reference-body"><img id="octave-reference" alt="1/3 倍频程分析底图">
          <div class="reference-placeholder" id="octave-placeholder">未提供 OneThreeOctave_base.svg</div></div>
      </section>
    </div>
  </aside>
</div>
<script type="module" src="./cad_viewer.js"></script>
</body>
</html>
