<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>Fab / Subfab CAD</title>
<style>
:root {font-family:"Segoe UI","Microsoft YaHei",sans-serif;color-scheme:light;}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0d1b29}
#layout{display:grid;grid-template-columns:minmax(0,58fr) 8px minmax(0,42fr);width:100vw;height:100vh;}
#cad-pane{position:relative;min-width:0;min-height:0;overflow:hidden;background:#0d1b29}
#cad-info{position:absolute;top:12px;left:12px;right:70px;z-index:3;max-width:470px;
  padding:8px 11px;background:#142739e8;color:#deedf7;border:1px solid #5670897d;
  border-radius:8px;pointer-events:none;font-size:12px;line-height:1.5;}
#selected-info{color:#94e1fc;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#selected-info:empty{display:none;}
#reset-view{position:absolute;top:12px;right:13px;z-index:5;width:42px;height:42px;
  border:1px solid #7b9fbd;background:#25547b;color:#fff;border-radius:9px;
  font-size:27px;line-height:1;cursor:pointer;}
#reset-view:hover,#reset-view:focus-visible{background:#387da8;outline:2px solid #a8dcff}
#cad-layers{width:100%;height:100%;display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);}
.cad-layer{position:relative;min-width:0;min-height:0;overflow:hidden;border-bottom:1px solid #466075;}
.cad-layer:last-child{border-bottom:0}
.cad-layer canvas{display:block;position:absolute;inset:0;width:100%;height:100%;}
#reference-pane{min-width:0;min-height:0;background:#fff;overflow:hidden;}
#reference-frames{display:grid;grid-template-rows:minmax(0,1fr) 8px minmax(0,1fr);height:100%;width:100%;}
.reference-frame{min-height:0;min-width:0;position:relative;overflow-x:auto;overflow-y:hidden;display:flex;align-items:center;justify-content:flex-start;background:#fff;}
.reference-frame img{display:none;flex:0 0 auto;width:auto;height:100%;object-fit:contain;max-width:none;max-height:none;}
.reference-placeholder{padding:15px;color:#8293a4;font-size:12px;text-align:center;}
.splitter{z-index:7;touch-action:none;user-select:none;position:relative;
  display:flex;align-items:center;justify-content:center;background:#c4d1da;}
.splitter::after{content:"";background:#6a8ca5;border-radius:3px;}
#main-splitter{cursor:col-resize;width:8px;}
#main-splitter::after{width:3px;height:42px;}
#reference-splitter{cursor:row-resize;height:8px;}
#reference-splitter::after{width:44px;height:3px;}
.splitter:hover,.splitter:focus-visible{background:#8cbad4;outline:none;}
body.dragging-divider{cursor:col-resize;user-select:none;}
body.dragging-divider.vertical{cursor:row-resize;}
@media(max-width:750px){
 #layout{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,55%) minmax(0,45%)}
 #main-splitter{display:none}
 #cad-info{top:6px;left:6px;right:59px;padding:6px;font-size:11px}
 #reset-view{top:6px;right:6px}
}
</style>
<script type="importmap">
{"imports":{
"three":"https://unpkg.com/three@0.160.0/build/three.module.js",
"three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="layout">
  <section id="cad-pane" aria-label="Fab 与 Subfab 联动 CAD">
    <div id="cad-info">
      滚轮缩放 · 右键拖动平移 · 左键拖动旋转 · 单击形状
      <div id="selected-info" aria-live="polite"></div>
    </div>
    <button type="button" id="reset-view" title="恢复平面俯视（保持当前缩放与平移）" aria-label="恢复平面俯视">↺</button>
    <div id="cad-layers">
      <div class="cad-layer" id="fab-stage" aria-label="Fab CAD"></div>
      <div class="cad-layer" id="subfab-stage" aria-label="Subfab CAD"></div>
    </div>
  </section>
  <div id="main-splitter" class="splitter" role="separator" aria-label="拖动调整 CAD 与 SVG 区域宽度" aria-orientation="vertical" tabindex="0"></div>
  <aside id="reference-pane" aria-label="PSD 与倍频程 SVG">
    <div id="reference-frames">
      <div class="reference-frame" id="psd-frame">
        <img id="psd-reference" alt="PSD 参考底图">
        <div class="reference-placeholder" id="psd-placeholder">PSD 图片未提供</div>
      </div>
      <div id="reference-splitter" class="splitter" role="separator" aria-label="拖动调整上下 SVG 图片区域高度" aria-orientation="horizontal" tabindex="0"></div>
      <div class="reference-frame" id="octave-frame">
        <img id="octave-reference" alt="1/3 倍频程参考底图">
        <div class="reference-placeholder" id="octave-placeholder">倍频程图片未提供</div>
      </div>
    </div>
  </aside>
</div>
<script type="module" src="./cad_viewer.js"></script>
</body>
</html>
