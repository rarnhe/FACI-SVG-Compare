<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>Fab / Subfab CAD</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff}
#layout{display:grid;grid-template-columns:minmax(0,58fr) 8px minmax(0,42fr);width:100%;height:100%}
#cad-pane{position:relative;min-width:0;min-height:0;overflow:hidden;background:#fff}
#cad-layers{width:100%;height:100%;display:grid;grid-template-rows:minmax(0,1fr) 8px minmax(0,1fr)}
#cad-fixed-divider{width:100%;height:8px;background:#c4d1da;pointer-events:none;user-select:none}
.cad-layer{position:relative;min-width:0;min-height:0;overflow:hidden;background:#fff}
.cad-layer canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
.cad-operation{position:absolute;top:10px;left:12px;z-index:3;max-width:calc(100% - 80px);
  display:flex;align-items:center;height:36px;color:#111;background:#fff;
  border:1px solid #bfc8cf;border-radius:8px;padding:0 10px;
  pointer-events:none;font-size:14px;line-height:1}
.cad-selection{position:absolute;bottom:12px;left:12px;right:auto;z-index:3;
  max-width:calc(100% - 24px);color:#111;background:#fffffff2;border:1px solid #bbc6d0;
  border-radius:8px;padding:5px 9px;font-size:12px;line-height:1.5;
  overflow-wrap:anywhere;pointer-events:none}
.cad-selection:empty{display:none}
#reset-view{position:absolute;top:10px;right:12px;z-index:5;width:36px;height:36px;
  border:1px solid #bfc8cf;background:#fff;color:#111;border-radius:8px;
  font-size:14px;line-height:1;cursor:pointer}
#reset-view:hover,#reset-view:focus-visible{background:#c9e3f3;outline:2px solid #7bb8e1}
.cad-context-menu{position:absolute;z-index:9;width:max-content;max-width:calc(100% - 8px);
  padding:2px;background:#fff;border:1px solid #aab6c0;box-shadow:0 5px 17px #0002;
  border-radius:6px;color:#111;font-size:13px}
.cad-context-menu[hidden],.cad-submenu[hidden],.cad-axis-description[hidden]{display:none}
.cad-context-menu button{display:flex;justify-content:space-between;align-items:center;
  gap:3px;width:100%;padding:5px 3px;white-space:nowrap;color:#111;background:#fff;border:0;
  border-radius:3px;font:inherit;text-align:left;cursor:pointer}
.cad-context-menu button:hover,.cad-context-menu button:focus-visible{background:#eaf3fc;outline:0}
.cad-menu-arrow{font:inherit;line-height:inherit}
.cad-context-menu,.cad-submenu{font-family:inherit;font-size:13px;line-height:18px;
  --cad-menu-row-height:28px;--cad-menu-row-gap:2px}
.cad-context-menu{display:flex;flex-direction:column;gap:var(--cad-menu-row-gap)}
.cad-context-menu button,.cad-submenu button{font:inherit;height:var(--cad-menu-row-height);
  min-height:var(--cad-menu-row-height);flex:none;line-height:18px}
.cad-submenu{position:absolute;z-index:11;left:0;top:0;padding:2px;width:32px;overflow:auto;
  display:flex;flex-direction:column;align-items:stretch;gap:var(--cad-menu-row-gap);
  background:#fff;border:1px solid #aab6c0;box-shadow:0 5px 17px #0002;border-radius:5px}
.cad-submenu button{display:block;position:relative;flex:none;width:100%;padding:5px 12px 5px 3px;
  text-align:left;border:0;background:#fff;color:#111;cursor:pointer;font:inherit;
  height:var(--cad-menu-row-height);min-height:var(--cad-menu-row-height);line-height:18px}
.cad-submenu button:hover,.cad-submenu button:focus-visible{background:#eaf3fc;outline:0}
.cad-submenu button[aria-checked="true"]::after{content:'✓';position:absolute;right:2px;font-weight:700}
.cad-submenu button:disabled{color:#999;cursor:default}
.cad-axis-description{position:absolute;z-index:11;background:#fff;color:#111;
  border:1px solid #aab6c0;border-radius:5px;box-shadow:0 5px 17px #0002;
  padding:5px;overflow:auto;overflow-wrap:anywhere;white-space:pre-wrap;font-size:13px;min-width:0;}
#reference-pane{position:relative;min-width:0;min-height:0;background:#fff;overflow:hidden}
#reference-log{position:absolute;z-index:12;top:12px;right:12px;display:none;
  width:max-content;max-width:calc(100% - 24px);height:auto;max-height:calc(100% - 24px);
  overflow:hidden;background:#fffffff2;border:1px solid #555;border-radius:0;
  box-shadow:0 3px 10px #0002;padding:6px 9px;color:#111;font-size:14px;font-weight:700;
  white-space:nowrap;text-align:left;cursor:grab;touch-action:none;user-select:none}
#reference-log:active{cursor:grabbing}
#reference-log .reference-log-line{display:block;line-height:1.7;text-align:left;
  font-size:14px;font-weight:700;cursor:context-menu}
#legend-context-menu{position:absolute;z-index:20;display:block;background:#fff;
  border:1px solid #9cabb7;padding:4px;box-shadow:0 4px 12px #0002}
.legend-menu-primary,.legend-menu-secondary{display:flex;flex-direction:column;gap:2px;align-items:stretch}
.legend-menu-primary button{display:block;width:100%;text-align:left}
.legend-menu-secondary{position:absolute;z-index:21;top:0;left:100%;min-width:118px;
  box-sizing:border-box;max-height:min(75vh,460px);overflow:auto;white-space:nowrap;background:#fff;
  border:1px solid #9cabb7;box-shadow:0 4px 12px #0002;padding:4px}
.legend-menu-secondary[hidden]{display:none}
#legend-context-menu[hidden]{display:none}
#legend-context-menu button{padding:5px 18px;border:0;background:#fff;color:#111;
  font:13px "Segoe UI","Microsoft YaHei",sans-serif;cursor:pointer}
#legend-context-menu button:hover{background:#e5f2fc}
.legend-menu-secondary button{text-align:left}
.legend-menu-secondary button[aria-checked="true"]::after{content:' ✓';font-weight:700}
#reference-frames{display:grid;grid-template-rows:minmax(0,1fr) 8px minmax(0,1fr);height:100%;width:100%}
.reference-frame{min-height:0;min-width:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#fff}
.reference-frame img{display:none;flex:0 0 auto;width:auto;height:auto;object-fit:contain}
.reference-overlays{position:absolute;inset:0;z-index:2;background:transparent;pointer-events:none}
.reference-overlays img{display:block;position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%);background:transparent;opacity:1;pointer-events:none}
.reference-placeholder{padding:15px;color:#8293a4;font-size:12px;text-align:center}
.splitter{z-index:7;touch-action:none;user-select:none;position:relative;
  display:flex;align-items:center;justify-content:center;background:#c4d1da}
.splitter::after{content:"";background:#6a8ca5;border-radius:3px}
#main-splitter{cursor:col-resize;width:8px}
#main-splitter::after{width:3px;height:42px}
#reference-splitter{cursor:row-resize;height:8px}
#reference-splitter::after{width:44px;height:3px}
.splitter:hover,.splitter:focus-visible{background:#8cbad4;outline:none}
body.dragging-divider{cursor:col-resize;user-select:none}
body.dragging-divider.vertical{cursor:row-resize}
@media(max-width:750px){
 #layout{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,55%) minmax(0,45%)}
 #main-splitter{display:none}
 .cad-operation{top:6px;left:6px;right:59px;font-size:14px}
 .cad-selection{bottom:6px;left:6px;font-size:11px}
 #reset-view{top:6px;right:6px}
}
</style>
<script type="importmap">
{"imports":{
"three":"https://unpkg.com/three@0.160.0/build/three.module.js",
"three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="layout">
  <section id="cad-pane" aria-label="Fab 与 Subfab 联动 CAD">
    <button type="button" id="reset-view" title="恢复平面俯视（保持当前缩放与平移）" aria-label="恢复平面俯视">↺</button>
    <div id="cad-layers">
      <div class="cad-layer" id="fab-stage" aria-label="Fab CAD">
        <div class="cad-operation">滚轮缩放·右键拖动平移·左键拖动旋转</div>
        <div id="fab-selected-info" class="cad-selection" aria-live="polite"></div>
      </div>
      <div id="cad-fixed-divider" aria-hidden="true"></div>
      <div class="cad-layer" id="subfab-stage" aria-label="Subfab CAD">
        <div id="subfab-selected-info" class="cad-selection" aria-live="polite"></div>
      </div>
    </div>
  </section>
  <div id="main-splitter" class="splitter" role="separator" aria-label="拖动调整 CAD 与 SVG 区域宽度" aria-orientation="vertical" tabindex="0"></div>
  <aside id="reference-pane" aria-label="PSD 与倍频程 SVG">
    <div id="reference-frames">
      <div class="reference-frame" id="psd-frame">
        <img id="psd-reference" alt="PSD 参考底图">
        <div class="reference-overlays" id="psd-overlays" aria-hidden="true"></div>
        <div class="reference-placeholder" id="psd-placeholder">PSD 图片未提供</div>
      </div>
      <div id="reference-splitter" class="splitter" role="separator" aria-label="拖动调整上下 SVG 图片区域高度" aria-orientation="horizontal" tabindex="0"></div>
      <div class="reference-frame" id="octave-frame">
        <img id="octave-reference" alt="1/3 倍频程参考底图">
        <div class="reference-overlays" id="octave-overlays" aria-hidden="true"></div>
        <div class="reference-placeholder" id="octave-placeholder">倍频程图片未提供</div>
      </div>
    </div>
    <div id="reference-log" role="status" aria-label="已选择 SVG 图表"></div>
    <div id="legend-context-menu" hidden role="menu"></div>
  </aside>
</div>
<script type="module" src="./cad_viewer.js"></script>
</body>
</html>
